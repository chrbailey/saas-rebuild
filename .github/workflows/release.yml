name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.6.0)"
        required: true
      target:
        description: "Commitish the tag points at"
        required: false
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate on the test suite
        # A tag that doesn't pass the suite doesn't become a release.
        run: |
          pip install pytest jsonschema pyyaml
          pytest tests/ -q

      - name: Create the GitHub release
        # On a tag push, release the pushed tag. On manual dispatch,
        # gh creates the tag server-side at the requested target first.
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            gh release create "$INPUT_TAG" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --target "$INPUT_TARGET" \
              --title "$INPUT_TAG" \
              --generate-notes
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
