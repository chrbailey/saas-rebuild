name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v0.6.0)"
        required: true
      target:
        description: "Commitish the tag points at"
        required: false
        default: "main"

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve the tag to release
        # Release-on-version-bump: a push to main releases v{plugin.json
        # version} unless that release already exists, so bumping the
        # version in a merged PR is the whole release procedure. Tag
        # pushes and manual dispatch release the named tag directly.
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate on the test suite
        # A version that doesn't pass the suite doesn't become a release.
        if: steps.tag.outputs.exists == 'false'
        run: |
          pip install pytest jsonschema pyyaml
          pytest tests/ -q

      - name: Create the GitHub release
        # gh creates the tag server-side when it doesn't exist yet
        # (branch-scoped clones can't push tags themselves).
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$TAG" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --generate-notes
          else
            gh release create "$TAG" dist/*.zip \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${INPUT_TARGET:-$GITHUB_SHA}" \
              --title "$TAG" \
              --generate-notes
          fi
