name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (for example, v0.7.0)"
        required: true
      target:
        description: "Commitish the tag points at"
        required: false
        default: "main"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Resolve the tag to release
        # Release-on-version-bump: a push to main releases v{plugin.json
        # version} unless that release already exists, so bumping the
        # version in a merged PR is the whole release procedure. Tag
        # pushes and manual dispatch release the named tag directly.
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate on the test suite
        # A version that doesn't pass the suite doesn't become a release.
        if: steps.tag.outputs.exists == 'false'
        run: |
          python -m pip install --requirement requirements-dev.txt
          python -m pytest tests/ -q
          PYTHONWARNINGS=error::ResourceWarning \
            python -m unittest discover \
            -s skills/export-compliance/tools/xscreen/tests \
            -t skills/export-compliance/tools

      - name: Require tag and plugin version to agree
        if: steps.tag.outputs.exists == 'false'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, pathlib
          version = json.loads(
              pathlib.Path(".claude-plugin/plugin.json").read_text()
          )["version"]
          tag = os.environ["TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match plugin version v{version}")
          PY

      - name: Build reproducible release archives
        if: steps.tag.outputs.exists == 'false'
        run: python scripts/package_skills.py --output-dir dist

      - name: Attest release archives
        if: steps.tag.outputs.exists == 'false'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/*.zip

      - name: Create the GitHub release
        # gh creates the tag server-side when it doesn't exist yet
        # (branch-scoped clones can't push tags themselves).
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "$TAG" \
              --generate-notes
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${INPUT_TARGET:-$GITHUB_SHA}" \
              --title "$TAG" \
              --generate-notes
          fi
