name: Teardown Report
description: Share sanitized results from a SaaS teardown so others can build on it
title: "[Teardown] <app or category>"
labels: ["teardown-report"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing! **Sanitize first**: no record contents, exports,
        customer/employee names, real-data screenshots, or internal URLs.
        Structure only — verdicts, categories, ranges. Name the app or just
        its category, whichever you're comfortable with.
  - type: input
    id: app
    attributes:
      label: App (or category)
      placeholder: "e.g. AppFolio, or just 'property management suite'"
    validations:
      required: true
  - type: input
    id: team-size
    attributes:
      label: Team size using the app (rough)
      placeholder: "e.g. 5-10 users"
  - type: dropdown
    id: methodology
    attributes:
      label: Evidence methodology
      description: How was the tenant-specific model constructed?
      options:
        - Live tenant
        - Document-based
        - Hybrid
    validations:
      required: true
  - type: textarea
    id: coverage
    attributes:
      label: Evidence coverage and blind spots
      description: Runtime window, roles/modules covered, retention limits, and material evidence that was unavailable
      placeholder: "e.g. 90-day audit window; admin + service roles; year-end and SFTP logs not observed"
    validations:
      required: true
  - type: textarea
    id: verdicts
    attributes:
      label: Verdict counts
      description: How many features landed in each bucket?
      placeholder: |
        Total features inventoried: ~60
        KEEP: 9  |  SIMPLIFY: 6  |  DROP: 38  |  DEFER: 7
    validations:
      required: true
  - type: textarea
    id: keep-set
    attributes:
      label: The KEEP set
      description: The workflows that actually earn the subscription (names + one line each)
    validations:
      required: true
  - type: textarea
    id: why-unused
    attributes:
      label: Top "why unused" reasons
      placeholder: "e.g. configured-never-enabled (14), never-needed (11), too-complex (9), duplicate (7), wrong-fit (3)"
  - type: input
    id: pairs-captured
    attributes:
      label: Shareable pairs captured
      description: "Counts by tier: sanitized-shareable / synthetic only — never raw-local-only."
      placeholder: "e.g. 120 sanitized-shareable, 40 synthetic"
  - type: textarea
    id: workarounds
    attributes:
      label: Workarounds discovered
      description: Things users did OUTSIDE the app that the replacement should make first-class
  - type: textarea
    id: target-architecture
    attributes:
      label: Target architecture
      description: Which capabilities belong in a skill, tested code/service, application/database, workflow engine, or retained system?
    validations:
      required: true
  - type: textarea
    id: preservation
    attributes:
      label: Preservation status
      description: What was exported and checksummed across records, files, audit history, configuration, identities, and replay material? Name accepted gaps.
    validations:
      required: true
  - type: textarea
    id: pipeline-gaps
    attributes:
      label: What this skill missed
      description: Steps, signals, or template fields the pipeline should have but doesn't — this is how the skill improves
  - type: textarea
    id: limitations
    attributes:
      label: What this teardown does not establish
      description: Non-claims, DEFER gates, sampling limits, and generalization limits
    validations:
      required: true
  - type: dropdown
    id: rebuild-status
    attributes:
      label: Rebuild status
      options:
        - Analysis only
        - Rebuild planned
        - Rebuild in progress
        - Running in parallel with the app
        - Fully cut over
  - type: checkboxes
    id: sanitized
    attributes:
      label: Sanitization check
      options:
        - label: I confirm this report contains no direct identifiers, record contents, secrets, internal URLs, or confidential tenant material
          required: true
